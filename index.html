<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10202b">
<title>Treasure Hunt</title>
<style>
  :root {
    --bg: #10202b;
    --card: #1a3040;
    --line: #2b4759;
    --text: #f3ede0;
    --muted: #9db2bf;
    --gold: #f2b84b;
    --good: #2fbf71;
    --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    max-width: 30rem;
    min-height: 100%;
    margin: 0 auto;
    padding: calc(1rem + env(safe-area-inset-top)) 1.1rem calc(1.5rem + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  header .progress { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  main { flex: 1; display: flex; flex-direction: column; gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.4rem 1.25rem; }
  .eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
  .big { font-size: 1.7rem; line-height: 1.2; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--muted); margin: .6rem 0 0; }
  .coords {
    font: 600 1.25rem/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--gold); margin: .9rem 0 0; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere;
  }
  .countdown { font: 700 2.6rem/1.1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--gold); margin: .4rem 0 0; font-variant-numeric: tabular-nums; }
  .stack { display: flex; flex-direction: column; gap: .7rem; margin-top: auto; }
  button, a.btn {
    display: block; width: 100%; padding: 1rem; border-radius: 14px; border: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-weight: 600; text-align: center;
    text-decoration: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  button.primary, a.btn.primary { background: var(--gold); border-color: var(--gold); color: #1c1503; }
  button:active, a.btn:active { transform: scale(.985); }
  button:focus-visible, a.btn:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  #reader-wrap { position: relative; border-radius: 18px; overflow: hidden; border: 3px solid var(--line); background: #000; min-height: 15rem; }
  #reader { width: 100%; }
  #reader video { display: block; width: 100% !important; object-fit: cover; }
  #reader-wrap.bad { border-color: var(--bad); animation: shake .4s; }
  #reader-wrap.good { border-color: var(--good); }
  .flash {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .3rem; font-weight: 700; font-size: 1.2rem; color: #fff; opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .flash .mark { font-size: 4rem; line-height: 1; }
  #reader-wrap.good .flash.ok { opacity: 1; background: rgba(47, 191, 113, .88); }
  #reader-wrap.bad .flash.no { opacity: 1; background: rgba(229, 72, 77, .8); }
  @keyframes shake {
    20% { transform: translateX(-9px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
  }
  .status { min-height: 1.5em; margin: 0; text-align: center; color: var(--muted); }
  .status.bad { color: var(--bad); }
  form.manual { display: flex; gap: .5rem; }
  form.manual input {
    flex: 1; min-width: 0; padding: .9rem; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit;
  }
  form.manual button { width: auto; padding: .9rem 1.1rem; }
  details summary { color: var(--muted); cursor: pointer; padding: .4rem 0; }
  details[open] summary { margin-bottom: .5rem; }
  ul.errors { margin: .6rem 0 0; padding-left: 1.1rem; }
  ul.errors li { margin: .3rem 0; }
  @media (prefers-reduced-motion: reduce) { #reader-wrap.bad { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Treasure Hunt</h1>
    <span class="progress" id="progress"></span>
  </header>
  <main id="screen" aria-live="polite"></main>
</div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>

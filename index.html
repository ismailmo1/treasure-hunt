<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪎</text></svg>">
  <title>Saj's Treasure Hunt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --text: #000;
      --muted: darkgray;
      --line: #000;
      --good: #2fbf71;
      --bad: #e5484d;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    /* otherwise rules like `button { display: block }` win over the attribute */
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 'Roboto Mono', monospace;
      -webkit-text-size-adjust: 100%;
    }

    #app {
      max-width: 30rem;
      min-height: 100%;
      margin: 0 auto;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1.1rem calc(1.5rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 1rem;
      font-weight: normal;
      margin: 0;
    }

    header .progress {
      display: block;
      font-size: large;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card {
      padding: .5rem 0;
    }

    .card.center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .eyebrow {
      font-size: large;
      color: var(--muted);
      margin: 0 0 .25rem;
    }

    .big {
      font-size: xx-large;
      line-height: 1.2;
      font-weight: normal;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .muted {
      color: var(--muted);
      font-size: large;
      margin: .6rem 0 0;
    }

    .coords {
      font-size: x-large;
      margin: .9rem 0 0;
      user-select: all;
      -webkit-user-select: all;
      overflow-wrap: anywhere;
    }

    .countdown {
      font-size: xx-large;
      margin: .4rem 0 0;
      font-variant-numeric: tabular-nums;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: .7rem;
      margin-top: auto;
    }

    button,
    a.btn {
      display: block;
      width: 100%;
      padding: .8rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font: 15px 'SF Pro Display', sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary,
    a.btn.primary {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    button:not(:disabled):active,
    a.btn:active {
      transform: scale(.985);
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    button:focus-visible,
    a.btn:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--muted);
      outline-offset: 2px;
    }

    #reader-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--line);
      background: #000;
      min-height: 15rem;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      display: block;
      width: 100%;
      min-height: 15rem;
      max-height: 60vh;
      object-fit: cover;
    }

    #reader-wrap.bad {
      border-color: var(--bad);
      animation: shake .4s;
    }

    #reader-wrap.good {
      border-color: var(--good);
    }

    .flash {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .3rem;
      font-size: large;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity .15s;
    }

    .flash .mark {
      font-size: 4rem;
      line-height: 1;
    }

    #reader-wrap.good .flash.ok {
      opacity: 1;
      background: rgba(47, 191, 113, .88);
    }

    #reader-wrap.bad .flash.no {
      opacity: 1;
      background: rgba(229, 72, 77, .8);
    }

    @keyframes shake {
      20% {
        transform: translateX(-9px);
      }

      40% {
        transform: translateX(9px);
      }

      60% {
        transform: translateX(-6px);
      }

      80% {
        transform: translateX(6px);
      }
    }

    .status {
      min-height: 1.5em;
      margin: 0;
      text-align: center;
      color: var(--muted);
    }

    .status.bad {
      color: var(--bad);
    }

    form.manual {
      display: flex;
      gap: .5rem;
    }

    form.manual input {
      flex: 1;
      min-width: 0;
      padding: .7rem;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    form.manual button {
      width: auto;
      padding: .7rem 1rem;
    }

    details summary {
      color: var(--muted);
      cursor: pointer;
      padding: .4rem 0;
    }

    details[open] summary {
      margin-bottom: .5rem;
    }

    ul.errors {
      margin: .6rem 0 0;
      padding-left: 1.1rem;
      text-align: left;
    }

    ul.errors li {
      margin: .3rem 0;
    }

    /* Finish screen: brown balloons drifting up behind the message */
    .balloons {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .card.center {
      position: relative;
      z-index: 1;
    }

    /* Outer element rises at a steady speed, the inner one sways, so the rise never slows down. */
    .balloon {
      position: absolute;
      top: 100%; /* starts just below the bottom edge */
      left: var(--x);
      width: var(--size);
      height: calc(var(--size) * 1.22);
      animation: balloon-rise var(--dur) linear var(--delay) infinite;
    }

    .balloon-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
      background: radial-gradient(circle at 35% 30%, #c9966b, #8b5a2b 55%, #5c3a1c);
      animation: balloon-sway var(--sway) ease-in-out infinite alternate;
    }

    .balloon-body::before {
      /* knot */
      content: "";
      position: absolute;
      left: 50%;
      bottom: -5px;
      width: 10px;
      height: 8px;
      background: #5c3a1c;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      transform: translateX(-50%);
    }

    .balloon-body::after {
      /* string */
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      width: 1px;
      height: 55px;
      background: rgba(0, 0, 0, .35);
    }

    @keyframes balloon-rise {
      from {
        transform: translateY(0);
      }

      to {
        /* the whole screen height plus the balloon and its string, so it's fully gone when the loop restarts */
        transform: translateY(calc(-100vh - var(--size) * 1.22 - 70px));
      }
    }

    @keyframes balloon-sway {
      from {
        transform: translateX(-14px) rotate(-4deg);
      }

      to {
        transform: translateX(14px) rotate(4deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #reader-wrap.bad {
        animation: none;
      }

      .balloons {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1 id="title">Saj's Treasure Hunt</h1>
      <span class="progress" id="progress"></span>
    </header>
    <main id="screen" aria-live="polite"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/barcode-detector@3.2.3/dist/iife/polyfill.min.js"></script>
  <script src="logic.js?v=20261113b"></script>
  <script src="app.js?v=20261113b"></script>
</body>

</html>
